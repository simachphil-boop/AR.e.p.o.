name: AR Engine API dump
on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/api.yml' ]
permissions:
  contents: read
  issues: write
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Download SDK and dump API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -sSL https://developer.huawei.com/repo/com/huawei/hms/arenginesdk/maven-metadata.xml -o meta.xml || true
          cat meta.xml
          V=$(grep -o '<release>[^<]*' meta.xml | sed 's/<release>//')
          [ -z "$V" ] && V=4.0.0.5
          echo "VERSION=$V"
          curl -sSL "https://developer.huawei.com/repo/com/huawei/hms/arenginesdk/$V/arenginesdk-$V.aar" -o sdk.aar
          curl -sSL "https://developer.huawei.com/repo/com/huawei/hms/arenginesdk/$V/arenginesdk-$V.pom" -o sdk.pom || true
          ls -la; mkdir aar && cd aar && unzip -q ../sdk.aar && ls -la && cd ..
          mkdir cls && cd cls && unzip -q ../aar/classes.jar && cd ..
          {
            echo "VERSION $V"; echo '```'; grep -o '<version>[^<]*' meta.xml | tr '\n' ' '; echo; cat sdk.pom | grep -A3 "<dependency>" | head -60; echo '```'
            echo '```xml'; cat aar/AndroidManifest.xml; echo '```'
          } > head.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "API: header $V" -F head.md
          for C in ARSession ARConfigBase ARWorldTrackingConfig ARFrame ARCamera ARPlane ARPose ARHitResult ARAnchor ARTrackable ARTrackableBase AREnginesApk ARLightEstimate ARPointCloud ARSceneMesh; do
            F=$(find cls -name "$C.class" | head -1)
            [ -z "$F" ] && continue
            { echo '```java'; javap -cp cls "$(echo ${F#cls/} | sed 's/\.class$//; s#/#.#g')"; echo '```'; } > c.md
            for E in $(find cls -path "*${C}\$*.class" | head -12); do
              N=$(echo ${E#cls/} | sed 's/\.class$//; s#/#.#g')
              { echo '```java'; javap -cp cls "$N"; echo '```'; } >> c.md
            done
            head -c 60000 c.md > c2.md
            gh issue create -R "$GITHUB_REPOSITORY" -t "API: $C" -F c2.md
          done
          find cls -name "*.class" | sed 's#cls/##' | grep -v '\$' | sort > list.txt
          { echo '```'; cat list.txt; echo '```'; } | head -c 60000 > l.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "API: class list" -F l.md
